      selector:
        text:
    endpoint_hostname:
      required: false
      example: |
        ["KadensSpyPhone", "living-room-apple-tv"]
      selector:
        text:
    endpoint_ip:
      required: false
      example: |
        ["192.168.202.244", "192.168.202.245"]
      selector:
        text:
    parent_endpoint_name:
      required: false
      example: "Firewalla-VLAN60"
      selector:
        text:
    alias:
      required: true
      example: "Kids iPhone"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

