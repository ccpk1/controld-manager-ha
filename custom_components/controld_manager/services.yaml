        ["Primary", "Kids"]
      selector:
        text:
    service_id:
      required: false
      example: |
        ["amazonmusic"]
      selector:
        text:
    service_name:
      required: false
      example: |
        ["Amazon Music"]
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

set_option_state:
