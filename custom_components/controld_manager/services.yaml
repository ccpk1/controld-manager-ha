        text:

set_service_state:
  name: Set service state
  description: Set one or more Control D services to Off, Blocked, Bypassed, or Redirected across the selected profiles. Redirect targets are only applied when Mode is Redirected.
  fields:
    profile_id:
      required: false
      example: |
        ["7b6d4e8a2c0141e8b6d0f9a3c2e4d1f0", "9f2a6c4e1b7d43a8a0c5e2f1d9b6c3a7"]
      selector:
        device:
          multiple: true
          filter:
            - integration: controld_manager
              model: Profile
    profile_name:
      required: false
      example: |
        ["Primary", "Kids"]
      selector:
        text:
    service_id:
      required: false
      example: |
        ["amazonmusic"]
      selector:
        text:
    service_name:
      required: false
      example: |
        ["Amazon Music"]
      selector:
        text:
    mode:
      required: true
      example: "Blocked"
      selector:
        select:
          options:
            - "Off"
            - "Blocked"
            - "Bypassed"
            - "Redirected"
    redirect_target:
      required: false
      description: Redirect destination. Use a Control D location code or name, `LOCAL` for auto routing, `?` for random routing, or an IP address for proxy redirects.
      example: "WFR"
      selector:
        text:
    redirect_target_type:
      required: false
      description: Optional redirect target family. When omitted, the integration infers `ipv4` or `ipv6` from a valid IP address and treats other values, including `LOCAL` and `?`, as location-family redirects.
      example: "location"
      selector:
        select:
          options:
            - location
            - ipv4
            - ipv6
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

delete_service:
  name: Delete service
  description: Remove one or more configured Control D services from the selected profiles. This unconfigures the row, so the service no longer appears on the profile. It is reversible by setting the service again with the Set service state service.
  fields:
    profile_id:
      required: false
      example: |
        ["7b6d4e8a2c0141e8b6d0f9a3c2e4d1f0", "9f2a6c4e1b7d43a8a0c5e2f1d9b6c3a7"]
