        ["Primary", "Kids"]
      selector:
        text:
    hostname:
      required: true
      example: |
        ["example.org", "example.net"]
      selector:
        text:
    rule_group_id:
      required: false
      example: "1"
      selector:
        text:
    rule_group_name:
      required: false
      example: "Allow folder"
      selector:
        text:
    enabled:
      required: false
      selector:
        boolean:
    mode:
      required: false
      example: "bypass"
      selector:
        select:
          options:
            - block
            - bypass
            - redirect
    redirect_target:
      required: false
      example: "1.1.1.1"
      description: When Mode is redirect, specify a Control D location code or name, `LOCAL` for auto routing, `?` for random routing, or an IPv4 or IPv6 address depending on Redirect target type.
      selector:
        text:
    redirect_target_type:
      required: false
      example: "ipv4"
      description: Choose how Redirect target should be interpreted. Use location for Control D location routing, including the special `LOCAL` auto and `?` random values, ipv4 for an IPv4 proxy target, or ipv6 for an IPv6 proxy target.
      selector:
        select:
          options:
            - location
            - ipv4
            - ipv6
    comment:
      required: false
      example: "Temporary allowance for maintenance"
      selector:
        text:
    expiration_duration:
      required: false
      example: "00:30:00"
      selector:
        duration:
    expire_at:
      required: false
      example: "2026-04-07T18:30:00"
      selector:
        datetime:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

