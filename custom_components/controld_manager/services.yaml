delete_client:
  name: Delete client
  description: >-
    DESTRUCTIVE and irreversible. Delete client rows from one or more Control D
    endpoints, resolved from client ID, MAC address, endpoint name, hostname, or
    IP address within one selected config entry. Client IDs take precedence over
    the other selectors. The client row is derived from observed traffic, so an
    ordinary client reappears the next time it is seen; a client that will not
    recur, such as one using a rotating private MAC, stays deleted. Stored query
    history for these clients is purged as well unless delete_history is false.
  fields:
    client_id:
      required: false
      example: |
        ["04070f91bf7d", "d18cc9582f25"]
      selector:
        text:
    endpoint_mac:
      required: false
      example: |
        ["50:eb:71:b6:78:3a", "3c:52:a1:11:22:33"]
      selector:
        text:
    endpoint_name:
      required: false
      example: |
        ["Chads-Phone", "Kitchen Tablet"]
      selector:
        text:
    endpoint_hostname:
      required: false
      example: |
        ["KadensSpyPhone", "living-room-apple-tv"]
      selector:
        text:
    endpoint_ip:
      required: false
      example: |
        ["192.168.202.244", "192.168.202.245"]
      selector:
        text:
    parent_endpoint_name:
      required: false
      example: "Firewalla-VLAN60"
      selector:
        text:
    delete_history:
      required: false
      default: true
      selector:
        boolean:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

set_endpoint_description:
  name: Set endpoint description
  description: Set the free-text note an endpoint carries, resolved by endpoint ID or display name within one selected config entry. Endpoint IDs take precedence over names. An empty string clears the description, because the API drops the field rather than keeping a blank value. This changes no behaviour.
  fields:
    endpoint_id:
      required: false
      example: |
        ["461wtt4eyr", "w1eg4mfif8"]
      selector:
        text:
    endpoint_name:
      required: false
      example: |
        ["Chads-Phone", "Kitchen Tablet"]
      selector:
        text:
    description:
      required: true
      example: "Kids tablet, kitchen"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

create_endpoint:
  name: Create endpoint
  description: Create one Control D endpoint, which is a DNS resolver that enforces a profile, within one selected config entry. A profile is required because an endpoint always enforces exactly one and the platform has no endpoint without one. The name must be unique across the account. Optionally set a description, an icon slug, and the initial analytics logging level.
  fields:
    endpoint_name:
      required: true
      example: "Kids-Tablet"
      selector:
        text:
    profile_id:
      required: true
      example: "962691chipwa5"
      selector:
        text:
    description:
      required: false
      example: "Tablet in the kitchen"
      selector:
        text:
    icon:
      required: false
      example: "desktop-linux"
      selector:
        text:
    mode:
      required: false
      selector:
        select:
          options:
            - "None"
            - "Some"
            - "Full"
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

delete_endpoint:
  name: Delete endpoint
  description: DESTRUCTIVE and irreversible. Delete one or more Control D endpoints resolved by endpoint ID or display name within one selected config entry. Endpoint IDs take precedence over names. Deleting an endpoint removes the resolver itself and the records kept against it, so whatever resolved through it stops being filtered; deleting a router endpoint affects every device behind it.
  fields:
    endpoint_id:
      required: false
      example: |
        ["461wtt4eyr", "w1eg4mfif8"]
      selector:
        text:
    endpoint_name:
      required: false
      example: |
        ["Chads-Phone", "Kitchen Tablet"]
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

set_endpoint_profile:
  name: Set endpoint profile
  description: Attach the profile an endpoint enforces, and optionally a second one, resolved by endpoint ID within one selected config entry. An endpoint always enforces one profile, so the primary can be changed but not emptied; the secondary is optional and can be cleared with clear_profile2. When two profiles are enforced, the rule engine merges them before matching rather than applying them in order.
  fields:
    endpoint_id:
      required: true
      example: |
        ["461wtt4eyr", "w1eg4mfif8"]
      selector:
        text:
    profile_id:
      required: false
      example: "962691chipwa5"
      selector:
        text:
    profile2_id:
      required: false
      example: "886818chik7jg"
      selector:
        text:
    clear_profile2:
      required: false
      default: false
      selector:
        boolean:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

rename_endpoint:
