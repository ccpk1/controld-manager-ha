set_rule_state:
  name: Set rule state
  description: Enable or disable one or more Control D custom rules by stable identity across the selected profiles, and optionally change their action mode, redirect target, comment, or expiration. If cancel_expiration is set, it overrides expiration_duration and expire_at. Otherwise, expire_at takes precedence over expiration_duration.
  fields:
    profile_id:
      required: false
      example: |
        ["7b6d4e8a2c0141e8b6d0f9a3c2e4d1f0", "9f2a6c4e1b7d43a8a0c5e2f1d9b6c3a7"]
      selector:
        device:
          multiple: true
          filter:
            - integration: controld_manager
              model: Profile
    profile_name:
      required: false
      example: |
        ["Primary", "Kids"]
      selector:
        text:
    rule_identity:
      required: false
      example: |
        ["root|example.com", "group:1|example2.com", "example.com"]
      selector:
        text:
    enabled:
      required: false
      selector:
        boolean:
    mode:
      required: false
      example: "bypass"
      selector:
        select:
          options:
            - block
            - bypass
            - redirect
    redirect_target:
      required: false
      example: "WFR"
      description: When Mode is Redirected, specify a Control D location code or name, `LOCAL` for auto routing, `?` for random routing, or an IPv4 or IPv6 address depending on Redirect target type.
      selector:
        text:
    redirect_target_type:
      required: false
      example: "location"
      description: Choose how Redirect target should be interpreted. Use location for Control D location routing, including the special `LOCAL` auto and `?` random values, ipv4 for an IPv4 proxy target, or ipv6 for an IPv6 proxy target.
      selector:
        select:
          options:
            - location
            - ipv4
            - ipv6
    comment:
      required: false
      example: "Temporary allowance for maintenance"
      selector:
        text:
    cancel_expiration:
      required: false
      selector:
        boolean:
    expiration_duration:
      required: false
      example: "00:30:00"
      selector:
        duration:
    expire_at:
      required: false
      example: "2026-04-07T18:30:00"
      selector:
        datetime:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

