              model: Profile
    profile_name:
      required: false
      example: |
        ["Primary", "Kids"]
      selector:
        text:
    mode:
      required: true
      example: "Bypassing"
      selector:
        select:
          options:
            - "Blocking"
            - "Bypassing"
            - "Redirecting"
    redirect_target:
      required: false
      example: "WFR"
      description: When Mode is Redirecting, specify a Control D location code or name, `LOCAL` for auto routing, or `?` for random routing.
      selector:
        text:
    redirect_target_type:
      required: false
      example: "location"
      description: Optional redirect target family. Default-rule redirects currently support only Control D location-family routing, including the special `LOCAL` auto and `?` random values.
      selector:
        select:
          options:
            - location
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: controld_manager
    config_entry_name:
      required: false
      selector:
        text:

get_catalog:
  name: Get catalog
  description: Return a copyable catalog of filters, services, rules, profile options, the default rule, or redirect locations for the selected Control D scope.
  fields:
    catalog_type:
      required: true
      selector:
        select:
          options:
            - filters
            - services
            - rules
            - profile_options
            - default_rule
            - redirect_locations
    search:
      required: false
      example: apple
      selector:
        text:
    limit:
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 500
          mode: box
    profile_id:
      required: false
      example: |
        ["7b6d4e8a2c0141e8b6d0f9a3c2e4d1f0", "9f2a6c4e1b7d43a8a0c5e2f1d9b6c3a7"]
